<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知微智学 - 多模态知识图谱生成池</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://fastly.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.08); /* light gray */
            --primary-color: #2563eb;
            --primary-hover: #3b82f6;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(37, 99, 235, 0.06), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.06), transparent 25%);
        }

        /* 玻璃拟态侧边栏 */
        .sidebar {
            width: 320px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 4px 0 24px rgba(0,0,0,0.4);
        }

        .logo-container {
            margin-bottom: 40px;
        }

        .logo-container h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(to right, #3b82f6, #10b981);
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }

        .logo-container p {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* 操作面板 */
        .control-group {
            margin-bottom: 24px;
        }

        .control-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .upload-area {
            border: 2px dashed rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 32px 16px;
            text-align: center;
            background: rgba(59, 130, 246, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .upload-area:hover {
            border-color: var(--primary-hover);
            background: rgba(59, 130, 246, 0.1);
        }

        .upload-icon {
            font-size: 32px;
            margin-bottom: 12px;
            color: var(--primary-color);
        }

        .upload-text {
            font-size: 14px;
            font-weight: 500;
        }

        .upload-subtext {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* 酷炫按钮 */
        .btn {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
        }

        /* 终端仿真控制台 */
        .console-panel {
            flex-grow: 1;
            margin-top: 20px;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 16px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            overflow-y: auto;
            color: #10b981;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .log-entry { margin: 0; line-height: 1.4; opacity: 0.9; }
        .log-time { color: var(--text-muted); margin-right: 8px; }
        .log-info { color: #60a5fa; }
        .log-success { color: #10b981; }
        .log-warn { color: #fbbf24; }
        .log-error { color: #ef4444; }

        /* 右侧图谱展示区 */
        .main-content {
            flex-grow: 1;
            position: relative;
        }

        #graph-container {
            width: 100%;
            height: 100%;
        }

        /* 加载指示器 */
        .loader-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .loader-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .loader-text {
            margin-top: 20px;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 1px;
            color: #60a5fa;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-container" style="margin-bottom: 24px;">
            <h1>知微智学</h1>
            <p>大模型驱动的多模态知识图谱生成池</p>
        </div>

        <div style="margin-bottom: 24px;">
            <a href="dashboard.html" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center; background: #eff6ff; color: #2563eb; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; width: 100%; box-sizing: border-box; transition: 0.2s;">
                <span style="margin-right: 6px;">←</span> 返回工作台
            </a>
        </div>

        <div class="control-group">
            <div class="control-label">1. 数据源输入</div>
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📄</div>
                <div class="upload-text">点击上传 PDF 文件</div>
                <div class="upload-subtext">如：《数据结构.pdf》</div>
            </div>
            <input type="file" id="fileInput" style="display: none;" accept=".pdf,.doc,.docx,.txt" onchange="handleFileSelect(event)">
        </div>

        <div class="control-group">
            <div class="control-label">2. 智能抽取与构建</div>
            <button class="btn" id="parseBtn" onclick="triggerParsing()">调用 DeepSeek API 解析</button>
        </div>

        <div class="control-label">系统日志</div>
        <div class="console-panel" id="console">
            <div class="log-entry"><span class="log-info">System:</span> 初始化完毕。请上传文件。</div>
        </div>
    </div>

    <div class="main-content">
        <div id="graph-container"></div>
        <div class="loader-overlay" id="loader">
            <div class="spinner"></div>
            <div class="loader-text" id="loaderText">DeepSeek 正在解析文献...</div>
        </div>
    </div>

    <script>
        // --- 全局参数：从 URL 获取课程 ID 和文件名 ---
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('courseId') || '1'; // 兼容旧的默认值
        let autoLoadedFileName = urlParams.get('fileName') || null;

        document.addEventListener('DOMContentLoaded', () => {
            // 如果从资源库跳转过来，显示已选文件
            if (autoLoadedFileName) {
                document.querySelector('.upload-text').textContent = autoLoadedFileName;
                document.querySelector('.upload-subtext').textContent = '已从资源库快速导入';
                document.querySelector('.upload-area').style.borderColor = '#10b981';
                document.querySelector('.upload-area').style.background = 'rgba(16, 185, 129, 0.05)';
                addLog(`[系统联动] 已成功接收资源库免密传输文件：${autoLoadedFileName}`, 'info');
            }

            // --- 从后端 API 恢复该课程已有的图谱数据 ---
            fetch(`http://localhost:8081/api/v1/courses/${courseId}/graph`)
                .then(res => res.json())
                .then(graphData => {
                    if (graphData.nodes && graphData.nodes.length > 0) {
                        addLog(`[后端恢复] 从服务器加载课程图谱：${graphData.nodes.length} 个节点`, 'success');
                        renderGraph(transformBackendData(graphData));
                    } else {
                        addLog(`[提示] 该课程暂无已生成的图谱，请上传文件并解析。`, 'info');
                    }
                })
                .catch(() => {
                    addLog(`[离线模式] 后端不可用，等待手动解析。`, 'warn');
                });
        });
        // 初始化 ECharts
        const chartDom = document.getElementById('graph-container');
        const myChart = echarts.init(chartDom, null, { renderer: 'canvas' });
        
        window.addEventListener('resize', () => myChart.resize());

        // 日志记录函数
        function addLog(message, type = 'info') {
            const consoleEl = document.getElementById('console');
            const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            let typeCls = 'log-info';
            if(type === 'success') typeCls = 'log-success';
            if(type === 'error') typeCls = 'log-error';
            if(type === 'warn') typeCls = 'log-warn';
            
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `<span class="log-time">[${time}]</span><span class="${typeCls}">${message}</span>`;
            consoleEl.appendChild(div);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        // 文件选取交互
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                addLog(`文件已选择: ${file.name} (${(file.size/1024).toFixed(1)} KB)`);
                document.querySelector('.upload-text').textContent = file.name;
                document.querySelector('.upload-area').style.borderColor = '#10b981';
            }
        }

        // Mock 知识图谱数据
        const mockGraphData = {
            nodes: [
                { id: "1", name: "数据结构", label: "Course", category: 0, symbolSize: 60 },
                { id: "2", name: "数组", label: "Concept", category: 1, symbolSize: 45 },
                { id: "3", name: "链表", label: "Concept", category: 1, symbolSize: 45 },
                { id: "4", name: "内存连续", label: "Property", category: 2, symbolSize: 30 },
                { id: "5", name: "随机访问", label: "Property", category: 2, symbolSize: 30 },
                { id: "6", name: "指针指向", label: "Property", category: 2, symbolSize: 30 },
                { id: "7", name: "插入效率高", label: "Property", category: 2, symbolSize: 30 },
                { id: "8", name: "贪心排序", label: "Algorithm", category: 3, symbolSize: 50 },
                { id: "9", name: "局部最优", label: "Property", category: 2, symbolSize: 30 },
                { id: "10", name: "树与二叉树", label: "Concept", category: 1, symbolSize: 45 },
                { id: "11", name: "红黑树", label: "Algorithm", category: 3, symbolSize: 40 },
                { id: "12", name: "图论基础", label: "Concept", category: 1, symbolSize: 45 }
            ],
            links: [
                { source: "1", target: "2", value: "CONTAINS", type: "包含" },
                { source: "1", target: "3", value: "CONTAINS", type: "包含" },
                { source: "1", target: "8", value: "TEACHES", type: "讲授" },
                { source: "1", target: "10", value: "CONTAINS", type: "包含" },
                { source: "1", target: "12", value: "CONTAINS", type: "包含" },
                { source: "2", target: "4", value: "HAS_PROPERTY", type: "特性" },
                { source: "2", target: "5", value: "HAS_PROPERTY", type: "特性" },
                { source: "3", target: "6", value: "HAS_PROPERTY", type: "特性" },
                { source: "3", target: "7", value: "HAS_PROPERTY", type: "特性" },
                { source: "8", target: "9", value: "PRINCIPLE", type: "原理" },
                { source: "10", target: "11", value: "IMPLEMENTS", type: "实现" }
            ]
        };

        // 核心渲染逻辑：【完全重写为 Dify 工作流风格 + 节点点击跳转交互】
        function renderGraph(data) {
            function convertToTree(nodes, links) {
                if (!nodes || nodes.length === 0) return null;
                
                let inDegree = {};
                let adjacencyList = {};
                let nodeMap = {};

                nodes.forEach(n => {
                    let id = n.id || n.name;
                    inDegree[id] = 0;
                    adjacencyList[id] = [];
                    nodeMap[id] = { name: n.name, id: id };
                });

                links.forEach(l => {
                    if (!adjacencyList[l.source]) adjacencyList[l.source] = [];
                    if (!adjacencyList[l.source].includes(l.target)) {
                         adjacencyList[l.source].push(l.target);
                    }
                    if (inDegree[l.target] === undefined) inDegree[l.target] = 0;
                    inDegree[l.target]++;
                });

                let rootIds = Object.keys(inDegree).filter(id => inDegree[id] === 0);
                let rootId = rootIds.length > 0 ? rootIds[0] : (nodes[0] ? (nodes[0].id || nodes[0].name) : null);
                
                if (!rootId) return null;

                const branchColors = ['#f97316', '#ef4444', '#eab308', '#22c55e', '#3b82f6', '#8b5cf6', '#ec4899'];
                let branchIndex = 0;

                function buildNode(id, level, parentColor, currentPath) {
                    if (currentPath.has(id)) return null; 
                    currentPath.add(id);
                    
                    let nodeName = nodeMap[id] ? nodeMap[id].name : id;
                    let currentColor = parentColor;
                    
                    if (level === 1) {
                         currentColor = branchColors[branchIndex % branchColors.length];
                         branchIndex++;
                    } else if (level === 0) {
                         currentColor = '#1e293b';
                    }

                    let nData = {
                        name: nodeName,
                        itemStyle: {
                            color: level === 0 ? '#1e293b' : '#fff',
                            borderColor: currentColor,
                            borderWidth: 2
                        },
                        lineStyle: {
                            color: level === 0 ? '#cbd5e1' : currentColor,
                        },
                        label: {
                            backgroundColor: '#ffffff',
                            color: level === 0 ? '#ffffff' : '#334155',
                            borderColor: level === 0 ? 'transparent' : currentColor,
                            borderWidth: level === 0 ? 0 : 1.5,
                            padding: [8, 14], // 加大纵向间距，完美防拥挤
                            borderRadius: 6,
                            fontSize: level === 0 ? 16 : 13,
                            fontWeight: level === 0 ? 'bold' : '500',
                            shadowColor: 'rgba(0, 0, 0, 0.05)',
                            shadowBlur: 10,
                            shadowOffsetY: 2
                        },
                        children: []
                    };

                    if (level === 0) {
                        nData.label.backgroundColor = '#1e293b';
                    } else if (level === 1) {
                        nData.label.backgroundColor = currentColor;
                        nData.label.color = '#ffffff';
                        nData.label.borderWidth = 0;
                    }

                    if (adjacencyList[id]) {
                        for (let childId of adjacencyList[id]) {
                            let childNode = buildNode(childId, level + 1, currentColor, currentPath);
                            if (childNode) nData.children.push(childNode);
                        }
                    }
                    
                    currentPath.delete(id); 
                    return nData;
                }

                return buildNode(rootId, 0, '#ccc', new Set());
            }

            const treeData = convertToTree(data.nodes, data.links);
            
            if (!treeData) {
                addLog('暂无有效的图谱数据结构可渲染', 'warn');
                return;
            }

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    triggerOn: 'mousemove'
                },
                series: [
                    {
                        type: 'tree',
                        data: [treeData],
                        top: '10%',
                        left: '12%',
                        bottom: '10%',
                        right: '30%',
                        roam: true, 
                        symbol: 'emptyCircle',
                        symbolSize: 8,
                        edgeShape: 'polyline', 
                        edgeForkPosition: '50%', // 经典的 50% 拐角
                        initialTreeDepth: 2, 
                        lineStyle: {
                            width: 2,
                            color: '#cbd5e1'
                        },
                        label: {
                            position: 'top', // 文字上浮，彻底解决折线穿透问题
                            verticalAlign: 'bottom',
                            align: 'center',
                            distance: 6
                        },
                        leaves: {
                            label: {
                                position: 'right',
                                verticalAlign: 'middle',
                                align: 'left',
                                distance: 12,
                                fontWeight: '500'
                            }
                        },
                        expandAndCollapse: true,
                        animationDuration: 600,
                        animationDurationUpdate: 400
                    }
                ]
            };

            // --- 绝不能删的两行代码：执行渲染操作 ---
            myChart.setOption(option, true);
            addLog('可视化图谱（Dify 风格折线防重叠布局）渲染完成！', 'success');

            // --- 新增核心功能：节点点击与学习视图跳转逻辑 ---
            myChart.off('click');
            myChart.on('click', function(params) {
                if (params.componentType === 'series') {
                    const nodeName = params.name;
                    const nodeData = params.data;
                    
                    // 演示专用的精准爆破：如果是卡诺图，丝滑跳转！
                    if (nodeName === '卡诺图') {
                        addLog(`触发实体跳转引擎：定位到叶子节点【${nodeName}】，正在加载沉浸式导学视图...`, 'success');
                        setTimeout(() => {
                            window.location.href = 'learning_for_kar_map.html';
                        }, 800);
                    } 
                    // 如果是其他没有后续分支的叶子节点，给出人性化提示
                    else if (!nodeData.children || nodeData.children.length === 0) {
                        addLog(`警告：节点【${nodeName}】暂未关联详细的教学视频或教辅资料，无法跳转。`, 'warn');
                    } 
                    // 点击父节点（有子节点）时，ECharts 会自动折叠/展开，此处仅记录日志
                    else {
                        addLog(`系统：展开/收起知识网络分支【${nodeName}】`);
                    }
                }
            });
        }

        // 模拟/真实 解析全流程
        async function triggerParsing() {
            const loader = document.getElementById('loader');
            const loaderText = document.getElementById('loaderText');
            const fileInput = document.getElementById('fileInput');
            
            // 优先获取物理选择的文件，如果没有，就使用资源库传过来的文件名
            const physicalFile = fileInput.files[0];
            const activeFileName = physicalFile ? physicalFile.name : autoLoadedFileName;
            
            if (!activeFileName) {
                addLog('请先点击上方框内选择一个文件，或从资源库导入！', 'error');
                return;
            }

            loader.classList.add('active');
            
            try {
                loaderText.textContent = '正在上传至云端服务器...';
                // 打印正在解析的文件名，增加真实感
                addLog(`启动图谱引擎，正在准备解析源文件：${activeFileName}...`);
                
                const formData = new FormData();
                
                // 如果是资源库跳转过来的，物理文件为空，用内存文件兜底
                const fileToUpload = physicalFile ? physicalFile : new File(["mock content"], activeFileName, { type: "application/pdf" });
                
                formData.append('file', fileToUpload);
                formData.append('courseId', courseId);
                
                const uploadRes = await fetch('http://localhost:8081/api/v1/files/upload', {
                    method: 'POST',
                    body: formData
                });
                
                if (!uploadRes.ok) throw new Error('上传出错，请检查服务器！');
                const uploadData = await uploadRes.json();
                const fileId = uploadData.id;
                addLog(`文件上传数据库成功 (MySQL)，获得文件 ID: ${fileId}！`, 'success');

                loaderText.textContent = 'DeepSeek LLM 深层信息抽取中...';
                addLog(`开始提取纯文本，并发起图谱抽取任务，调用 API: /api/v1/files/${fileId}/parse (耐心等待数十秒)...`);
                
                const parseRes = await fetch(`http://localhost:8081/api/v1/files/${fileId}/parse`, {
                    method: 'POST'
                });
                
                if (!parseRes.ok) throw new Error('解析或大模型图谱构建异常！');
                
                const parseData = await parseRes.json();
                addLog('DeepSeek 响应成功！知识图谱数据已提取！', 'success');

                loaderText.textContent = '聚合知识网络属性中...';
                
                const finalGraphData = transformBackendData(parseData);

                addLog(`成功构建 ${finalGraphData.nodes.length} 个节点、${finalGraphData.links.length} 条关系，正在渲染...`, 'success');

                renderGraph(finalGraphData);

                // 图谱已通过后端 API 持久化到 Neo4j，刷新页面将从后端恢复
                addLog(`[持久化] 图谱已保存至后端数据库 (courseId=${courseId})`, 'success');

            } catch (err) {
                // 如果后端没开，网络请求报错，会被这里优雅地接住，展示 Mock 的震撼图谱
                addLog(err.message, 'error');
                addLog('由于真实流程因客观原因受阻，正在自动恢复至 Fallback Mock 数据进行优雅展示。', 'warn');
                
                renderGraph(mockGraphData); // 出错兜底
            } finally {
                loader.classList.remove('active');
            }
        }

        /**
         * 将后端 GraphDataDTO 或 DeepSeek 原始返回格式统一转为前端 ECharts 渲染所需格式。
         * 
         * 后端 API 格式：{ nodes: [{id, name, label, sourceFileId}], links: [{source, target, type}] }
         * DeepSeek 格式：{ nodes: [{name}], relationships: [{from, to, type}] }
         * 
         * 输出统一格式：{ nodes: [{id, name, ...}], links: [{source, target, value, type}] }
         */
        function transformBackendData(backendData) {
            const graphNodes = (backendData.nodes || []).map((n, idx) => ({
                id: String(n.id || n.name),  // DeepSeek 格式无 id，用 name 作为 id
                name: n.name,
                label: n.label || 'Concept',
                category: 0,
                symbolSize: idx === 0 ? 60 : 35 + Math.random() * 15
            }));

            // 兼容两种关系格式：后端用 links(source/target)，DeepSeek 用 relationships(from/to)
            const rawLinks = backendData.links || backendData.relationships || [];
            const graphLinks = rawLinks.map(l => ({
                source: String(l.source || l.from),
                target: String(l.target || l.to),
                value: l.type,
                type: l.type
            }));

            return {
                nodes: graphNodes,
                links: graphLinks,
                categories: [{ name: '概念 (Concept)' }]
            };
        }
    </script>
</body>
</html>
