<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知微智学 - 大模型驱动的多模态知识图谱生成与导学平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #3b82f6;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            background: #f8fafc;
            color: var(--text-main);
        }

        /* 左侧插画/宣发区 */
        .hero-section {
            flex: 1.2;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        /* 背景装饰几何图形 */
        .hero-section::before {
            content: '';
            position: absolute;
            top: -10%; left: -10%;
            width: 400px; height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            filter: blur(40px);
        }

        .hero-section::after {
            content: '';
            position: absolute;
            bottom: -10%; right: -10%;
            width: 300px; height: 300px;
            background: rgba(16, 185, 129, 0.2);
            border-radius: 50%;
            filter: blur(50px);
        }

        .hero-content {
            z-index: 10;
            max-width: 500px;
        }

        .hero-tag {
            background: rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        .hero-title {
            font-size: 48px;
            font-weight: 700;
            margin: 0 0 20px 0;
            line-height: 1.2;
        }

        .hero-desc {
            font-size: 18px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 40px;
        }

        /* 右侧表单区 */
        .form-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            position: relative;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            padding: 40px;
        }

        .login-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .login-header h2 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }

        .login-header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 15px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            color: var(--text-main);
            box-sizing: border-box;
            transition: all 0.3s;
            outline: none;
            background: #f8fafc;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-color);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: var(--text-muted);
        }

        .actions a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-login:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        .footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        /* 身份切换样式 */
        .role-selector {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 32px;
            position: relative;
        }

        .role-option {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.3s;
            z-index: 1;
        }

        .role-option.active {
            color: var(--primary-color);
        }

        .role-glider {
            position: absolute;
            height: calc(100% - 8px);
            width: calc(50% - 4px);
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            top: 4px;
            left: 4px;
        }

        .role-selector[data-active="student"] .role-glider {
            transform: translateX(100%);
        }

    </style>
</head>
<body>

    <div class="hero-section">
        <div class="hero-content">
            <div class="hero-tag">🌟 大模型驱动 · 多模态融合</div>
            <h1 class="hero-title">知微智学<br>知识图谱导学平台</h1>
            
            
            <div style="display: flex; gap: 20px; margin-top: 20px; opacity: 0.8;">
                <div style="text-align: center;">
                    <div style="font-size: 32px; font-weight: 700;">80%</div>
                    <div style="font-size: 13px;">提升备课效率</div>
                </div>
                <div style="width: 1px; background: rgba(255,255,255,0.3);"></div>
                <div style="text-align: center;">
                    <div style="font-size: 32px; font-weight: 700;">10k+</div>
                    <div style="font-size: 13px;">萃取知识节点</div>
                </div>
            </div>
        </div>
    </div>

    <div class="form-section">
        <div class="login-box">
            <div class="login-header">
                <h2>欢迎回来</h2>
                <p>请选择身份并输入账号登录进入系统</p>
            </div>

            <div class="role-selector" id="roleSelector" data-active="teacher">
                <div class="role-glider"></div>
                <div class="role-option active" id="btn-teacher" onclick="switchRole('teacher')">教师登录</div>
                <div class="role-option" id="btn-student" onclick="switchRole('student')">学生登录</div>
            </div>

            <form onsubmit="handleLogin(event)">
                <input type="hidden" id="userRole" value="teacher">
                <div class="input-group">
                    <label>账号</label>
                    <div class="input-wrapper">
                        <input type="text" placeholder="教工号/学号 (如: 0214820)" required value="teacher_001">
                    </div>
                </div>
                
                <div class="input-group">
                    <label>密码</label>
                    <div class="input-wrapper">
                        <input type="password" placeholder="••••••••" required value="123456">
                    </div>
                </div>

                <div class="actions">
                    <label class="remember-me">
                        <input type="checkbox" style="margin-right: 8px;" checked> 自动登录
                    </label>
                    <a href="#">忘记密码?</a>
                </div>

                <button type="submit" class="btn-login">立即登录</button>
            </form>

            <script>
                function switchRole(role) {
                    const selector = document.getElementById('roleSelector');
                    const teacherBtn = document.getElementById('btn-teacher');
                    const studentBtn = document.getElementById('btn-student');
                    const roleInput = document.getElementById('userRole');
                    const accountInput = document.querySelector('input[type="text"]');
                    
                    selector.setAttribute('data-active', role);
                    roleInput.value = role;
                    
                    if (role === 'teacher') {
                        teacherBtn.classList.add('active');
                        studentBtn.classList.remove('active');
                        accountInput.placeholder = '教工号 (如: 0214820)';
                        accountInput.value = 'teacher_001';
                    } else {
                        studentBtn.classList.add('active');
                        teacherBtn.classList.remove('active');
                        accountInput.placeholder = '学号 (如: 2024001)';
                        accountInput.value = 'student_001';
                    }
                }

                function handleLogin(event) {
                    event.preventDefault();
                    const role = document.getElementById('userRole').value;
                    // 根据角色跳转到不同的主页，或者在 dashboard 中根据权限展示
                    if (role === 'teacher') {
                        window.location.href = 'dashboard.html';
                    } else {
                        window.location.href = 'learning.html';
                    }
                }
            </script>

            <div class="footer">
                还没有账号？ <a href="#">在此注册</a>
            </div>
        </div>
    </div>

</body>
</html>
