# Copy this file to application-local.properties and fill in local secrets.
# application-local.properties is ignored by git.

spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=your-qq-mailbox@qq.com
spring.mail.password=replace-with-qq-smtp-authorization-code
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=true

verification-code.email.from=your-qq-mailbox@qq.com
