<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知微智学 - 图谱学习</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://fastly.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.08);
            --primary-color: #2563eb;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }
        body {
            margin: 0; padding: 0;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex; height: 100vh; overflow: hidden;
        }
        .sidebar {
            width: 260px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 24px; display: flex; flex-direction: column;
        }
        .logo-container h1 {
            font-size: 20px; font-weight: 700; margin: 0;
            background: linear-gradient(to right, #3b82f6, #10b981);
            -webkit-background-clip: text; color: transparent;
        }
        .logo-container p { margin: 4px 0 24px 0; font-size: 13px; color: var(--text-muted); }
        .nav-item {
            display: block; padding: 12px 16px; color: var(--text-muted);
            text-decoration: none; border-radius: 8px; margin-bottom: 8px; font-weight: 500;
        }
        .nav-item:hover { background-color: #f8fafc; color: var(--primary-color); }
        .nav-item.active { background-color: #eff6ff; color: var(--primary-color); }
        .main-content { flex-grow: 1; position: relative; display: flex; flex-direction: column; }
        .header { height: 60px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 24px; background: white; font-weight: 600;}
        #graph-container { flex-grow: 1; width: 100%; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo-container">
            <h1>知微智学</h1>
            <p>学生端图谱学习</p>
        </div>
        <nav>
            <a href="learning.html" class="nav-item">🏠 学习主页</a>
            <a href="student_courses.html" class="nav-item">📖 我的课程</a>
            <a href="#" class="nav-item active">🕸️ 图谱探索</a>
        </nav>
    </aside>

    <div class="main-content">
        <div class="header">
            <span id="courseTitle">课程图谱加载中...</span>
        </div>
        <div id="graph-container"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentCourseId = urlParams.get('courseId');
        
        let chartInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            initGraph();
            if (currentCourseId) {
                loadGraphData(currentCourseId);
            } else {
                document.getElementById('courseTitle').innerText = '未选择课程';
            }
        });

        function initGraph() {
            const container = document.getElementById('graph-container');
            chartInstance = echarts.init(container);

            window.addEventListener('resize', () => {
                chartInstance.resize();
            });

            chartInstance.on('click', function (params) {
                if (params.dataType === 'node' && params.data && params.data.id) {
                    window.location.href = `learning_for_kar_map.html?courseId=${currentCourseId}&nodeId=${params.data.id}`;
                }
            });
        }

        async function loadGraphData(courseId) {
            try {
                // Fetch course info for title
                const courseRes = await fetch(`/api/v1/courses/${courseId}`);
                if (courseRes.ok) {
                    const course = await courseRes.json();
                    document.getElementById('courseTitle').innerText = course.name + ' - 知识图谱';
                }

                // Fetch graph
                const res = await fetch(`/api/v1/courses/${courseId}/graph`);
                if (!res.ok) throw new Error('Failed to fetch graph data');
                const data = await res.json();
                renderECharts(data.nodes, data.links);
            } catch (error) {
                console.error('加载图谱失败:', error);
                document.getElementById('courseTitle').innerText = '加载图谱失败';
            }
        }

        function renderECharts(nodesData, linksData) {
            // Transform data for ECharts
            const echartsNodes = nodesData.map(node => {
                let color = '#3b82f6';
                let symbolSize = 40;
                if (node.type === 'concept') { color = '#10b981'; symbolSize = 35; }
                else if (node.type === 'resource') { color = '#f59e0b'; symbolSize = 25; }

                return {
                    id: String(node.id),
                    name: node.name,
                    category: node.type,
                    symbolSize: symbolSize,
                    itemStyle: { color: color, borderColor: '#fff', borderWidth: 2 },
                    label: { show: true, position: 'right', formatter: '{b}', fontSize: 12 }
                };
            });

            const echartsLinks = linksData.map(link => {
                return {
                    id: String(link.id),
                    source: String(link.sourceId),
                    target: String(link.targetId),
                    value: link.relationType,
                    label: { show: true, formatter: '{c}', fontSize: 10 }
                };
            });

            const option = {
                tooltip: { formatter: '{b}' },
                series: [{
                    type: 'graph',
                    layout: 'force',
                    force: { repulsion: 800, edgeLength: [80, 150], gravity: 0.1 },
                    roam: true,
                    draggable: true,
                    label: { show: true },
                    edgeSymbol: ['circle', 'arrow'],
                    edgeSymbolSize: [4, 8],
                    edgeLabel: { fontSize: 10 },
                    data: echartsNodes,
                    links: echartsLinks,
                    lineStyle: { color: '#94a3b8', width: 2, curveness: 0.2 },
                    emphasis: { focus: 'adjacency', lineStyle: { width: 4 } }
                }]
            };

            chartInstance.setOption(option, true);
        }
    </script>
</body>
</html>
