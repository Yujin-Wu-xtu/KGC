<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知微智学 - 图谱学习</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://fastly.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.08);
            --primary-color: #2563eb;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }
        body {
            margin: 0; padding: 0;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex; height: 100vh; overflow: hidden;
        }
        .sidebar {
            width: 260px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 24px; display: flex; flex-direction: column;
        }
        .logo-container h1 {
            font-size: 20px; font-weight: 700; margin: 0;
            background: linear-gradient(to right, #3b82f6, #10b981);
            -webkit-background-clip: text; color: transparent;
        }
        .logo-container p { margin: 4px 0 24px 0; font-size: 13px; color: var(--text-muted); }
        .nav-item {
            display: block; padding: 12px 16px; color: var(--text-muted);
            text-decoration: none; border-radius: 8px; margin-bottom: 8px; font-weight: 500;
        }
        .nav-item:hover { background-color: #f8fafc; color: var(--primary-color); }
        .nav-item.active { background-color: #eff6ff; color: var(--primary-color); }
        .main-content { flex-grow: 1; position: relative; display: flex; flex-direction: column; }
        .header { height: 60px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 24px; background: white; font-weight: 600;}
        #graph-container { flex-grow: 1; width: 100%; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo-container">
            <h1>知微智学</h1>
            <p>学生端图谱学习</p>
        </div>
        <nav>
            <a href="learning.html" class="nav-item">🏠 学习主页</a>
            <a href="student_courses.html" class="nav-item">📖 我的课程</a>
            <a href="#" class="nav-item active">🕸️ 图谱探索</a>
        </nav>
    </aside>

    <div class="main-content">
        <div class="header">
            <span id="courseTitle">课程图谱加载中...</span>
        </div>
        <div id="graph-container"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentCourseId = urlParams.get('courseId');
        
        let chartInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            initGraph();
            if (currentCourseId) {
                loadGraphData(currentCourseId);
            } else {
                document.getElementById('courseTitle').innerText = '未选择课程';
            }
        });

        function initGraph() {
            const container = document.getElementById('graph-container');
            chartInstance = echarts.init(container);

            window.addEventListener('resize', () => {
                chartInstance.resize();
            });

            // 点击节点跳转到该知识点的学习页（保留学生端交互）
            chartInstance.on('click', function (params) {
                if (params.componentType === 'series' && params.data && params.data.id) {
                    window.location.href = `learning_for_kar_map.html?courseId=${currentCourseId}&nodeId=${params.data.id}`;
                }
            });
        }

        async function loadGraphData(courseId) {
            try {
                // Fetch course info for title
                const courseRes = await fetch(`/api/v1/courses/${courseId}`);
                if (courseRes.ok) {
                    const course = await courseRes.json();
                    document.getElementById('courseTitle').innerText = course.name + ' - 知识图谱';
                }

                // Fetch graph
                const res = await fetch(`/api/v1/courses/${courseId}/graph`);
                if (!res.ok) throw new Error('Failed to fetch graph data');
                const data = await res.json();
                if (!data.nodes || data.nodes.length === 0) {
                    document.getElementById('courseTitle').innerText = '该课程暂无已保存的图谱';
                    document.getElementById('graph-container').innerHTML = `
                        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:#64748b;">
                            <div style="font-size:48px; margin-bottom:16px;">🕸️</div>
                            <div style="font-size:16px; font-weight:500;">教师尚未保存该课程的知识图谱</div>
                            <div style="font-size:13px; margin-top:8px;">请稍后刷新页面重试</div>
                        </div>`;
                    return;
                }
                // 与教师端 index.html 相同的树形布局渲染
                renderGraph(data);
            } catch (error) {
                console.error('加载图谱失败:', error);
                document.getElementById('courseTitle').innerText = '加载图谱失败';
            }
        }

        // ===================== 树形图谱渲染（与教师端 index.html 对齐） =====================

        function renderGraph(data) {
            function convertToTree(nodes, links) {
                if (!nodes || nodes.length === 0) return null;

                let inDegree = {};
                let adjacencyList = {};
                let nodeMap = {};

                nodes.forEach(n => {
                    let id = n.id || n.name;
                    inDegree[id] = 0;
                    adjacencyList[id] = [];
                    nodeMap[id] = { name: n.name, id: id };
                });

                links.forEach(l => {
                    let src = l.source !== undefined ? l.source : l.sourceId;
                    let tgt = l.target !== undefined ? l.target : l.targetId;
                    if (!adjacencyList[src]) adjacencyList[src] = [];
                    if (!adjacencyList[src].includes(tgt)) {
                        adjacencyList[src].push(tgt);
                    }
                    if (inDegree[tgt] === undefined) inDegree[tgt] = 0;
                    inDegree[tgt]++;
                });

                let rootIds = Object.keys(inDegree).filter(id => inDegree[id] === 0);
                let rootId = rootIds.length > 0 ? rootIds[0] : (nodes[0] ? (nodes[0].id || nodes[0].name) : null);

                if (!rootId) return null;

                const branchColors = ['#f97316', '#ef4444', '#eab308', '#22c55e', '#3b82f6', '#8b5cf6', '#ec4899'];
                let branchIndex = 0;

                function buildNode(id, level, parentColor, currentPath) {
                    if (currentPath.has(id)) return null;
                    currentPath.add(id);

                    let nodeName = nodeMap[id] ? nodeMap[id].name : id;
                    let currentColor = parentColor;

                    if (level === 1) {
                        currentColor = branchColors[branchIndex % branchColors.length];
                        branchIndex++;
                    } else if (level === 0) {
                        currentColor = '#1e293b';
                    }

                    let nData = {
                        id: id, // 保留后端节点 ID，用于点击跳转学习页
                        name: nodeName,
                        itemStyle: {
                            color: level === 0 ? '#1e293b' : '#fff',
                            borderColor: currentColor,
                            borderWidth: 2
                        },
                        lineStyle: {
                            color: level === 0 ? '#cbd5e1' : currentColor,
                        },
                        label: {
                            backgroundColor: '#ffffff',
                            color: level === 0 ? '#ffffff' : '#334155',
                            borderColor: level === 0 ? 'transparent' : currentColor,
                            borderWidth: level === 0 ? 0 : 1.5,
                            padding: [8, 14],
                            borderRadius: 6,
                            fontSize: level === 0 ? 16 : 13,
                            fontWeight: level === 0 ? 'bold' : '500',
                            shadowColor: 'rgba(0, 0, 0, 0.05)',
                            shadowBlur: 10,
                            shadowOffsetY: 2
                        },
                        children: []
                    };

                    if (level === 0) {
                        nData.label.backgroundColor = '#1e293b';
                    } else if (level === 1) {
                        nData.label.backgroundColor = currentColor;
                        nData.label.color = '#ffffff';
                        nData.label.borderWidth = 0;
                    }

                    if (adjacencyList[id]) {
                        for (let childId of adjacencyList[id]) {
                            let childNode = buildNode(childId, level + 1, currentColor, currentPath);
                            if (childNode) nData.children.push(childNode);
                        }
                    }

                    currentPath.delete(id);
                    return nData;
                }

                return buildNode(rootId, 0, '#ccc', new Set());
            }

            const treeData = convertToTree(data.nodes, data.links);

            if (!treeData) {
                document.getElementById('courseTitle').innerText = '该课程暂无有效的图谱数据';
                return;
            }

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    triggerOn: 'mousemove'
                },
                series: [
                    {
                        type: 'tree',
                        data: [treeData],
                        top: '10%',
                        left: '12%',
                        bottom: '10%',
                        right: '30%',
                        roam: true,
                        symbol: 'emptyCircle',
                        symbolSize: 8,
                        edgeShape: 'polyline',
                        edgeForkPosition: '50%',
                        initialTreeDepth: 2,
                        lineStyle: {
                            width: 2,
                            color: '#cbd5e1'
                        },
                        label: {
                            position: 'top',
                            verticalAlign: 'bottom',
                            align: 'center',
                            distance: 6
                        },
                        leaves: {
                            label: {
                                position: 'right',
                                verticalAlign: 'middle',
                                align: 'left',
                                distance: 12,
                                fontWeight: '500'
                            }
                        },
                        expandAndCollapse: true,
                        animationDuration: 600,
                        animationDurationUpdate: 400
                    }
                ]
            };

            chartInstance.setOption(option, true);
        }
    </script>
</body>
</html>
