<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知微智学 - 注册</title>
    <style>
        :root { --primary: #2563eb; --text: #1e293b; --muted: #64748b; --border: #e2e8f0; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: Inter, "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #eff6ff, #f8fafc); color: var(--text); display: grid; place-items: center; padding: 24px; }
        main { width: min(100%, 480px); background: #fff; border-radius: 18px; padding: 36px; box-shadow: 0 18px 50px rgba(15, 23, 42, .12); }
        h1 { margin: 0 0 8px; font-size: 28px; }
        .lead { margin: 0 0 28px; color: var(--muted); line-height: 1.6; }
        label { display: block; margin: 16px 0 7px; font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 9px; font: inherit; }
        input:focus, select:focus { outline: 3px solid rgba(37, 99, 235, .15); border-color: var(--primary); }
        .hint { color: var(--muted); font-size: 12px; margin: 7px 0 0; line-height: 1.5; }
        button { width: 100%; border: 0; border-radius: 9px; background: var(--primary); color: #fff; padding: 13px; margin-top: 26px; font: inherit; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .65; cursor: wait; }
        .footer { text-align: center; margin: 22px 0 0; color: var(--muted); font-size: 14px; }
        a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <h1>创建知微智学账号</h1>
        <p class="lead">填写邮箱或手机号至少一项即可注册。用户名可不填，系统会使用你的邮箱或手机号作为登录账号。</p>
        <form id="register-form">
            <label for="username">用户名（可选）</label>
            <input id="username" name="username" maxlength="254" placeholder="例如 teacher_wu">

            <label for="email">邮箱</label>
            <input id="email" name="email" type="email" placeholder="name@example.com">

            <label for="phone">手机号</label>
            <input id="phone" name="phone" inputmode="tel" placeholder="例如 13800138000">
            <p class="hint">邮箱和手机号至少填写一项；当前版本不发送验证码。</p>

            <label for="password">密码</label>
            <input id="password" name="password" type="password" minlength="6" required placeholder="至少 6 位">

            <label for="role">身份</label>
            <select id="role" name="role">
                <option value="ROLE_STUDENT">学生</option>
                <option value="ROLE_TEACHER">教师</option>
            </select>

            <button type="submit">注册并返回登录</button>
        </form>
        <p class="footer">已有账号？<a href="login.html">去登录</a></p>
    </main>
    <script>
        const form = document.getElementById('register-form');
        const apiBase = window.location.protocol === 'file:' ? 'http://localhost:8081' : '';

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const email = form.email.value.trim();
            const phone = form.phone.value.trim();
            if (!email && !phone) {
                alert('请至少填写邮箱或手机号。');
                return;
            }

            const button = form.querySelector('button');
            button.disabled = true;
            button.textContent = '注册中...';
            try {
                const response = await fetch(`${apiBase}/api/v1/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: form.username.value.trim() || null,
                        email: email || null,
                        phone: phone || null,
                        password: form.password.value,
                        role: form.role.value
                    })
                });
                const payload = await response.json().catch(async () => ({ message: await response.text() }));
                if (!response.ok) {
                    throw new Error(payload.message || payload || '注册失败，请检查填写内容。');
                }
                const identifier = encodeURIComponent(payload.username || email || phone);
                window.location.href = `login.html?identifier=${identifier}`;
            } catch (error) {
                alert(error.message || '注册失败，请稍后重试。');
            } finally {
                button.disabled = false;
                button.textContent = '注册并返回登录';
            }
        });
    </script>
</body>
</html>
