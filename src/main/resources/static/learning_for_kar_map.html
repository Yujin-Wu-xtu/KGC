<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鐭ュ井鏅哄 - 娌夋蹈寮忕煡璇嗗瀛﹁鍥?/title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg-body: #0f172a;       
            --bg-card: #1e293b;
            --text-dark: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #38bdf8;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header */
        .top-header {
            height: 60px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }
        .header-title { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 12px; }
        .back-btn { text-decoration: none; color: var(--text-muted); background: #334155; padding: 6px 12px; border-radius: 6px; font-size: 13px; transition: 0.2s;}
        .back-btn:hover { color: white; background: #475569; }

        .progress-indicator { display: flex; align-items: center; gap: 12px; font-size: 13px; }
        .progress-bar { width: 150px; height: 6px; background: #334155; border-radius: 3px; overflow: hidden; }
        .progress-fill { width: 45%; height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.5s ease;}

        /* Main Workspace */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
        }

        /* Left side - Mini Tree / Outline */
        .outline-pane {
            width: 320px;
            background: rgba(30, 41, 59, 0.5);
            border-right: 1px solid var(--border);
            padding: 24px 0;
            overflow-y: auto;
        }
        
        .outline-title {
            padding: 0 24px; margin-bottom: 16px; font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;
        }

        .tree-node {
            padding: 10px 24px 10px 48px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
            position: relative;
        }
        .tree-node::before { content: ''; position: absolute; left: 32px; top: 0; bottom: 0; width: 1px; background: var(--border); }
        .tree-node::after { content: ''; position: absolute; left: 32px; top: 20px; width: 12px; height: 1px; background: var(--border); }
        .tree-node:hover { background: rgba(56, 189, 248, 0.1); color: var(--accent); }
        .tree-node.active { background: rgba(56, 189, 248, 0.15); color: var(--accent); font-weight: 600; border-right: 3px solid var(--accent); }
        .tree-node.active::after { background: var(--accent); }
        
        .tree-parent {
            padding: 10px 24px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;
        }

        /* Center - Interactive Content */
        .content-pane {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            position: relative;
        }

        .breadcrumb { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
        .concept-title { font-size: 28px; font-weight: 700; margin: 0 0 24px 0; }

        .video-player {
            width: 100%;
            border-radius: 12px;
            background: #000;
            aspect-ratio: 16/9;
            margin-bottom: 32px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border);
        }

        .doc-snippet {
            background: var(--bg-card);
            border-left: 4px solid var(--accent);
            padding: 24px;
            border-radius: 0 12px 12px 0;
            line-height: 1.7;
            font-size: 15px;
            color: #cbd5e1;
            margin-bottom: 32px;
        }

        /* Right side - Relations & AI QA & Quiz */
        .inspector-pane {
            width: 380px;
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .inspector-tabs {
            display: flex; border-bottom: 1px solid var(--border);
        }
        .tab { 
            flex: 1; padding: 16px; text-align: center; cursor: pointer; 
            font-size: 14px; font-weight: 500; color: var(--text-muted); 
            border-bottom: 2px solid transparent; transition: 0.2s;
        }
        .tab:hover { color: var(--text-dark); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        .inspector-content { padding: 24px; flex: 1; overflow-y: auto; }
        
        /* 閫夐」鍗″唴瀹瑰尯瀹瑰櫒 */
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* 鍏宠仈瀹炰綋缃戠粶鏍峰紡 */
        .relation-chip {
            background: #334155; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #475569; transition: 0.2s;
        }
        .relation-chip:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.1); cursor: pointer; }
        .badge { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-size: 11px; color: var(--text-muted); }

        .ai-tutor {
            margin-top: 32px;
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.3);
            border-radius: 12px;
            padding: 20px;
        }
        .ai-title { font-weight: 600; font-size: 14px; color: var(--accent); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .ai-input {
            width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.2); border: 1px solid var(--border);
            padding: 12px; border-radius: 8px; color: white; resize: none; font-family: inherit; font-size: 13px;
        }
        .ai-input:focus { outline: none; border-color: var(--accent); }

        .ai-response {
            margin-top: 16px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            color: #f8fafc;
            border-left: 3px solid var(--accent);
            display: none;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

        .loading-dots:after {
            content: ' .';
            animation: dots 1s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ' .'; }
            40% { content: ' ..'; }
            60% { content: ' ...'; }
            80%, 100% { content: ''; }
        }

        /* 闅忓爞妫€娴嬩笓椤规牱寮?*/
        .quiz-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .quiz-question {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.6;
            margin: 0 0 16px 0;
            color: #f8fafc;
        }
        .quiz-option {
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 13px;
            color: #cbd5e1;
            transition: all 0.2s;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
        }
        .quiz-option:hover { border-color: var(--text-muted); }
        .quiz-option.selected {
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.15);
            color: #fff;
        }
        /* 鎵规敼鍚庣殑鐘舵€?*/
        .quiz-option.correct {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            font-weight: 600;
        }
        .quiz-option.wrong {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            opacity: 0.7;
        }
        
        .quiz-feedback {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            display: none; /* 榛樿闅愯棌锛屾彁浜ゅ悗鏄剧ず */
        }
        .quiz-feedback.show-success {
            display: block;
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--success);
            color: #d1fae5;
        }
        .quiz-feedback.show-error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            border-left: 4px solid var(--danger);
            color: #fee2e2;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4); }
        .btn-submit:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

        /* AI 鐢熸垚鎸夐挳鐗规晥 */
        .btn-ai-gen {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.5);
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .btn-ai-gen:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        
        /* 瀵煎嚭绠€鎶ユā鎬佹鏍峰紡 (A4 绾稿紶椋庢牸) */
        .export-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .export-modal-overlay.active { display: flex; }
        .report-paper {
            background: white;
            width: 800px;
            max-height: 90vh;
            color: #334155;
            padding: 50px 70px;
            border-radius: 4px;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        .report-header { border-bottom: 2px solid #0f172a; padding-bottom: 20px; margin-bottom: 30px; text-align: center; }
        .report-title { font-size: 26px; font-weight: 700; color: #0f172a; margin: 0; letter-spacing: 2px; }
        .report-subtitle { font-size: 13px; color: #64748b; margin-top: 10px; text-transform: uppercase; }
        .report-section { margin-bottom: 32px; }
        .report-section-title { font-size: 16px; font-weight: 700; color: #0f172a; border-left: 5px solid #2563eb; padding-left: 12px; margin-bottom: 12px; background: #f8fafc; padding-top: 4px; padding-bottom: 4px; }
        .report-content { font-size: 14px; line-height: 1.8; color: #334155; text-align: justify; }
        .report-tag { display: inline-block; background: #f1f5f9; padding: 4px 10px; border-radius: 4px; font-size: 12px; margin-right: 8px; margin-bottom: 8px; border: 1px solid #e2e8f0; }
        
        .btn-export-trigger {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-export-trigger:hover { background: var(--primary); border-color: var(--primary); }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .export-modal-overlay { position: static; background: none; display: block; padding: 0; }
            .report-paper { width: 100%; height: auto; max-height: none; box-shadow: none; padding: 0; }
        }
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        .loading-skeleton {
            height: 100px;
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }


    </style>
</head>

    <script>
        // ==================== 数据状态 ====================
        let currentNodeData = null;  // 当前节点详情
        let currentCourseName = '';
        const urlParams = new URLSearchParams(window.location.search);
        const nodeId = urlParams.get('nodeId');
        const courseId = urlParams.get('courseId');

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', async () => {
            if (!nodeId || !courseId) {
                document.getElementById('conceptTitle').innerText = '参数错误：缺少 nodeId 或 courseId';
                return;
            }
            await loadNodeData();
            await loadCourseName();
        });

        async function loadNodeData() {
            try {
                const res = await fetch(`/api/v1/graph/nodes/${nodeId}`);
                if (!res.ok) throw new Error('节点加载失败');
                currentNodeData = await res.json();

                // 渲染标题
                document.getElementById('conceptTitle').innerText = currentNodeData.name;
                document.getElementById('breadcrumb').innerText = `课程图谱 / ${currentNodeData.name}`;
                document.getElementById('docSnippet').innerText =
                    `"${currentNodeData.name}" 是课程知识图谱中的一个${currentNodeData.label || '概念'}节点。`
                    + (currentNodeData.sourceFileId
                        ? `该知识点提取自课件资源（文件ID: ${currentNodeData.sourceFileId}）。`
                        : '点击右侧关联实体可探索相关概念。');
                document.getElementById('sourceInfo').innerText =
                    currentNodeData.sourceFileId ? `文本来源：课件资源 #${currentNodeData.sourceFileId}` : '';

                // 渲染关联节点
                const relatedEl = document.getElementById('relatedEntities');
                if (currentNodeData.relatedNodes && currentNodeData.relatedNodes.length > 0) {
                    relatedEl.innerHTML = currentNodeData.relatedNodes.map(rn => {
                        const arrow = rn.direction === 'out' ? '→' : '←';
                        return `<div class="relation-chip">
                            <div>
                                <div style="font-weight: 600; color: #f8fafc; margin-bottom: 4px;">${escapeHtml(rn.name)}</div>
                                <div class="badge">${escapeHtml(rn.relationType)}</div>
                            </div>
                            <span>${arrow}</span>
                        </div>`;
                    }).join('');
                } else {
                    relatedEl.innerHTML = '<div style="color: var(--text-muted); font-size: 13px;">该节点暂无关联实体</div>';
                }

                // 更新 AI 上下文
                document.getElementById('ai-context-q').innerText =
                    `关于"${currentNodeData.name}"，你可以向 AI 助教提问任何不懂的概念...`;
            } catch (e) {
                console.error('加载节点失败:', e);
                document.getElementById('conceptTitle').innerText = '加载失败';
                document.getElementById('docSnippet').innerText = '无法加载知识节点数据，请检查后端是否运行。';
            }
        }

        async function loadCourseName() {
            try {
                const res = await fetch(`/api/v1/courses/${courseId}`);
                if (res.ok) {
                    const course = await res.json();
                    currentCourseName = course.name;
                    document.getElementById('headerCourseName').innerText =
                        `《${course.name}》学生导学视图`;
                }
            } catch (e) {
                console.warn('加载课程名失败', e);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== Tab 切换 ====================
        function switchTab(tabName) {
            document.getElementById('tab-network').classList.remove('active');
            document.getElementById('tab-quiz').classList.remove('active');
            document.getElementById('content-network').classList.remove('active');
            document.getElementById('content-quiz').classList.remove('active');
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('content-' + tabName).classList.add('active');
        }

        // ==================== 随堂检测 ====================
        let userAnswers = { 'q1': null, 'q2': null };
        let correctAnswers = { 'q1': 'B', 'q2': 'B' };
        let currentQuizData = null;

        function selectOption(questionId, selectedValue) {
            if (document.getElementById('submitBtn').disabled) return;
            userAnswers[questionId] = selectedValue;
            const options = document.querySelectorAll(`#${questionId} .quiz-option`);
            options.forEach(opt => {
                opt.classList.remove('selected');
                if (opt.innerText.startsWith(selectedValue)) {
                    opt.classList.add('selected');
                }
            });
        }

        function submitQuiz() {
            const questionIds = Object.keys(correctAnswers);
            let allAnswered = true;
            questionIds.forEach(id => { if(!userAnswers[id]) allAnswered = false; });
            if (!allAnswered) { alert("请先完成所有题目再提交哦！"); return; }

            let score = 0;
            questionIds.forEach(qId => {
                const options = document.querySelectorAll(`#${qId} .quiz-option`);
                const feedbackEl = document.getElementById(`feedback-${qId}`);
                const isCorrect = userAnswers[qId] === correctAnswers[qId];
                if (isCorrect) score++;
                options.forEach(opt => {
                    opt.classList.remove('selected');
                    if (opt.innerText.startsWith(correctAnswers[qId])) opt.classList.add('correct');
                    else if (opt.innerText.startsWith(userAnswers[qId]) && !isCorrect) opt.classList.add('wrong');
                });
                if (currentQuizData && currentQuizData[qId]) {
                    feedbackEl.innerHTML = `<strong>✅ AI 知识点透析：</strong> ${isCorrect ? '回答正确！' : '很遗憾，答错了。'}<br><br>${currentQuizData[qId].explanation}`;
                } else {
                    if (qId === 'q1') {
                        feedbackEl.innerHTML = `<strong>✅ AI 知识点透析：</strong> 回答正确！<br><br>卡诺图的核心原理就是利用<strong>格雷码（Gray Code）</strong>的特性。二进制递增（如 01 到 10）有两位发生突变，不满足逻辑相邻；而格雷码（00, 01, 11, 10）保证了相邻的格子永远只有 1 位变量不同。`;
                    } else if (qId === 'q2') {
                        feedbackEl.innerHTML = `<strong>✅ AI 知识点透析：</strong> 太棒了，完全正确！<br><br>这是一个必须掌握的规律！圈住 2^n 个格子可以消除 n 个变量。`;
                    }
                }
                feedbackEl.className = 'quiz-feedback ' + (isCorrect ? 'show-success' : 'show-error');
            });
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = `批改完成！得分: ${score}/${questionIds.length}`;
            if (score === questionIds.length) {
                setTimeout(() => {
                    document.getElementById('top-progress').style.width = '100%';
                    document.getElementById('top-progress-text').innerText = '100% (已精通)';
                    document.getElementById('top-progress-text').style.color = '#10b981';
                }, 500);
            }
        }

        // ==================== AI 动态出题 ====================
        async function generateAIQuiz() {
            const btnEl = document.getElementById('ai-gen-btn');
            const containerEl = document.getElementById('quiz-container');
            const submitBtn = document.getElementById('submitBtn');
            const conceptTitle = currentNodeData ? currentNodeData.name : document.querySelector('.concept-title').innerText;
            const contextText = document.querySelector('.doc-snippet').innerText;

            btnEl.disabled = true;
            btnEl.innerHTML = '<span class="loading-dots">AI 正在根据图谱出题</span>';
            containerEl.innerHTML = '<div class="loading-skeleton"></div><div class="loading-skeleton"></div>';
            submitBtn.disabled = true;

            const prompt = `你是一个出题专家。请根据以下知识点上下文，生成2道单选题。
            知识点：${conceptTitle}
            背景资料：${contextText}
            
            请严格按照以下 JSON 格式返回，不要有任何多余文字：
            {
              "q1": { "question": "题干", "options": ["A. xxx", "B. xxx", "C. xxx", "D. xxx"], "answer": "A", "explanation": "详细的 AI 解析" },
              "q2": { "question": "题干", "options": ["A. xxx", "B. xxx", "C. xxx", "D. xxx"], "answer": "B", "explanation": "详细的 AI 解析" }
            }`;

            try {
                // 通过后端代理调用 AI，不暴露 API key
                const response = await fetch('/api/v1/ai/quiz', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                if (!response.ok) throw new Error('AI 出题失败');
                const data = await response.json();
                const quiz = JSON.parse(data.content);
                renderQuiz(quiz);
            } catch (error) {
                console.error(error);
                btnEl.innerHTML = '⚠️ 生成失败，点击重试';
                btnEl.disabled = false;
            }
        }

        function renderQuiz(quiz) {
            const containerEl = document.getElementById('quiz-container');
            const btnEl = document.getElementById('ai-gen-btn');
            const submitBtn = document.getElementById('submitBtn');
            containerEl.innerHTML = `<div style="font-size: 13px; color: var(--accent); margin-bottom: 16px; font-weight: 600;">✅ 已成功生成 AI 针对性训练：</div>`;
            userAnswers = {};
            correctAnswers = {};
            currentQuizData = quiz;
            Object.keys(quiz).forEach(id => {
                const item = quiz[id];
                userAnswers[id] = null;
                correctAnswers[id] = item.answer;
                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.id = id;
                let optionsHtml = '';
                item.options.forEach(opt => {
                    const label = opt.charAt(0);
                    optionsHtml += `<div class="quiz-option" onclick="selectOption('${id}', '${label}')">${opt}</div>`;
                });
                card.innerHTML = `<p class="quiz-question">${id.replace('q', '')}. ${item.question}</p>${optionsHtml}<div class="quiz-feedback" id="feedback-${id}"></div>`;
                containerEl.appendChild(card);
            });
            btnEl.disabled = false;
            btnEl.innerHTML = '✅ 重新生成 AI 测评';
            submitBtn.disabled = false;
            submitBtn.innerText = '提交并查看 AI 解析';
        }

        // ==================== AI 助教 ====================
        async function askAI() {
            const inputEl = document.getElementById('ai-input');
            const btnEl = document.getElementById('ai-send-btn');
            const responseEl = document.getElementById('ai-response');
            let userQuery = inputEl.value.trim();
            if (!userQuery) {
                const contextQ = document.getElementById('ai-context-q').innerText;
                userQuery = contextQ;
            }
            btnEl.disabled = true;
            btnEl.innerHTML = '<span class="loading-dots">AI 正在思考</span>';
            btnEl.style.background = '#334155';
            responseEl.style.display = 'none';

            const nodeName = currentNodeData ? currentNodeData.name : '当前节点';
            const courseName = currentCourseName || '课程';
            const systemPrompt = `你是名为"知微智学"的AI智能助教。你现在正在辅助学生学习《${courseName}》课程中的"${nodeName}"章节。你的回复应当：1. 专业且严谨，准确解释相关概念。2. 亲切且具有启发性，鼓励学生深入思考。3. 简洁有力，重点突出，适合在网页侧边栏展示。4. 语言使用中文。`;

            try {
                // 通过后端代理调用 AI
                const response = await fetch('/api/v1/ai/tutor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        systemPrompt: systemPrompt,
                        userQuery: userQuery
                    })
                });
                if (!response.ok) throw new Error('AI 请求失败');
                const data = await response.json();
                responseEl.innerHTML = `<strong>✅ AI 解析：</strong><br>${data.content.replace(/\n/g, '<br>')}`;
                responseEl.style.display = 'block';
            } catch (error) {
                console.error('AI Error:', error);
                responseEl.innerHTML = `<span style="color: var(--danger)">⚠️ 抱歉，AI 助教暂时断开连接，请检查网络或稍后再试。</span>`;
                responseEl.style.display = 'block';
            } finally {
                btnEl.disabled = false;
                btnEl.innerText = '发送';
                btnEl.style.background = 'var(--primary)';
            }
        }

        // ==================== 导出简报 ====================
        function previewReport() {
            const conceptTitle = document.querySelector('.concept-title').innerText;
            const contextText = document.querySelector('.doc-snippet').innerText;
            const courseName = currentCourseName || '课程';
            const progressText = document.getElementById('top-progress-text').innerText;
            document.getElementById('rpt-concept').innerText = conceptTitle;
            document.getElementById('rpt-course').innerText = courseName;
            document.getElementById('rpt-summary').innerText = contextText;
            document.getElementById('rpt-progress').innerText = progressText;
            document.getElementById('rpt-date').innerText = new Date().toLocaleString();

            const chips = document.querySelectorAll('.relation-chip div div:first-child');
            const chipContainer = document.getElementById('rpt-entities');
            chipContainer.innerHTML = '';
            chips.forEach(c => {
                const tag = document.createElement('span');
                tag.className = 'report-tag';
                tag.innerText = c.innerText;
                chipContainer.appendChild(tag);
            });
            const submitBtn = document.getElementById('submitBtn');
            const quizStatus = submitBtn.disabled ? `已完成测评，${submitBtn.innerText}` : "尚未完成本次针对性测评。";
            document.getElementById('rpt-quiz').innerText = quizStatus;
            document.getElementById('exportModal').classList.add('active');
        }

        function closeExportModal() { document.getElementById('exportModal').classList.remove('active'); }
        function printReport() { window.print(); }
    </script>
