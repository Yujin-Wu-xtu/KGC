            background: rgba(30, 41, 59, 0.5);
            border-right: 1px solid var(--border);
            padding: 24px 0;
            overflow-y: auto;

        .outline-title {
            padding: 0 24px; margin-bottom: 16px; font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;

        .tree-node {
            padding: 10px 24px 10px 48px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
            position: relative;
        }
        .tree-node::before { content: ''; position: absolute; left: 32px; top: 0; bottom: 0; width: 1px; background: var(--border); }
        .tree-node::after { content: ''; position: absolute; left: 32px; top: 20px; width: 12px; height: 1px; background: var(--border); }

        .tree-parent {
            padding: 10px 24px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;

        }

    <script>
        // 1. Tab 鍒囨崲閫昏緫
        function switchTab(tabName) {
            // 绉婚櫎鎵€鏈?active 绫?            document.getElementById('tab-network').classList.remove('active');
            document.getElementById('tab-quiz').classList.remove('active');
            document.getElementById('content-network').classList.remove('active');
            document.getElementById('content-quiz').classList.remove('active');

            // 婵€娲婚€変腑鐨?Tab
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('content-' + tabName).classList.add('active');
        }

        // 2. 闅忓爞妫€娴嬪瓨鍌ㄧ敤鎴烽€夋嫨
        let userAnswers = {
            'q1': null,
            'q2': null

            'q1': 'B',
            'q2': 'B'

        let currentQuizData = null; // 瀛樺偍褰撳墠棰樼洰璇︽儏锛岀敤浜庢覆鏌撹В鏋?
        // 3. 閫変腑閫夐」鏁堟灉
        function selectOption(questionId, selectedValue) {
            // 濡傛灉宸茬粡鎻愪氦杩囦簡锛屼笉鍏佽鍐嶄慨鏀?            if (document.getElementById('submitBtn').disabled) return;

            userAnswers[questionId] = selectedValue;
            
            // 鑾峰彇璇ラ鐩笅鐨勬墍鏈夐€夐」骞舵竻闄?selected 鐘舵€?            const options = document.querySelectorAll(`#${questionId} .quiz-option`);
            options.forEach(opt => {
                opt.classList.remove('selected');
                // 鍒ゆ柇褰撳墠鐐瑰嚮鐨勬槸鍝釜閫夐」锛屾坊鍔?selected
                if (opt.innerText.startsWith(selectedValue)) {
                    opt.classList.add('selected');
                }
            });
        }

        // 4. 鎻愪氦鎵规敼涓?AI 瑙ｆ瀽灞曠ず
        function submitQuiz() {
            const questionIds = Object.keys(correctAnswers);
            let allAnswered = true;
            questionIds.forEach(id => { if(!userAnswers[id]) allAnswered = false; });

            if (!allAnswered) {
                alert("璇峰厛瀹屾垚鎵€鏈夐鐩啀鎻愪氦鍝︼紒");
                return;
            }

            let score = 0;

            questionIds.forEach(qId => {
                const options = document.querySelectorAll(`#${qId} .quiz-option`);
                const feedbackEl = document.getElementById(`feedback-${qId}`);
                const isCorrect = userAnswers[qId] === correctAnswers[qId];

                if (isCorrect) score++;

                options.forEach(opt => {
                    opt.classList.remove('selected');
                    if (opt.innerText.startsWith(correctAnswers[qId])) {
                        opt.classList.add('correct');
                    } else if (opt.innerText.startsWith(userAnswers[qId]) && !isCorrect) {
                        opt.classList.add('wrong');
                    }
                });

                // 濡傛灉鏄?AI 鐢熸垚鐨勶紝浣跨敤 AI 杩斿洖鐨勮В鏋?                if (currentQuizData && currentQuizData[qId]) {
                    feedbackEl.innerHTML = `<strong>鉁?AI 鐭ヨ瘑鐐归€忔瀽锛?/strong> ${isCorrect ? '鍥炵瓟姝ｇ‘锛? : '寰堥仐鎲撅紝绛旈敊浜嗐€?}<br><br>${currentQuizData[qId].explanation}`;
                } else {
                    // 榛樿闈欐€佽В鏋?                    if (qId === 'q1') {
                        feedbackEl.innerHTML = `<strong>鉁?AI 鐭ヨ瘑鐐归€忔瀽锛?/strong> 鍥炵瓟姝ｇ‘锛?br><br>鍗¤鍥剧殑鏍稿績鍘熺悊灏辨槸鍒╃敤<strong>鏍奸浄鐮侊紙Gray Code锛?/strong>鐨勭壒鎬с€備簩杩涘埗閫掑锛堝 01 鍒?10锛夋湁涓や綅鍙戠敓绐佸彉锛屼笉婊¤冻閫昏緫鐩搁偦锛涜€屾牸闆风爜锛?0, 01, 11, 10锛変繚璇佷簡鐩搁偦鐨勬牸瀛愭案杩滃彧鏈?1 浣嶅彉閲忎笉鍚屻€俙;
                    } else if (qId === 'q2') {
                        feedbackEl.innerHTML = `<strong>鉁?AI 鐭ヨ瘑鐐归€忔瀽锛?/strong> 澶浜嗭紝瀹屽叏姝ｇ‘锛?br><br>杩欐槸涓€涓繀椤绘帉鎻＄殑瑙勫緥锛佸湀浣?2^n 涓牸瀛愬彲浠ユ秷闄?n 涓彉閲忋€俙;
                    }
                }
                feedbackEl.className = 'quiz-feedback ' + (isCorrect ? 'show-success' : 'show-error');
            });

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = `鎵规敼瀹屾垚锛佸緱鍒? ${score}/${questionIds.length}`;

            if (score === questionIds.length) {
                setTimeout(() => {
                    document.getElementById('top-progress').style.width = '100%';
                    document.getElementById('top-progress-text').innerText = '100% (宸茬簿閫?';
                    document.getElementById('top-progress-text').style.color = '#10b981';
                }, 500);
            }
        }

        // 5. AI 鍔ㄦ€佸嚭棰橀€昏緫
        async function generateAIQuiz() {
            const btnEl = document.getElementById('ai-gen-btn');
            const containerEl = document.getElementById('quiz-container');
            const submitBtn = document.getElementById('submitBtn');
            const conceptTitle = document.querySelector('.concept-title').innerText;

            btnEl.disabled = true;

            containerEl.innerHTML = '<div class="loading-skeleton"></div><div class="loading-skeleton"></div>';
            submitBtn.disabled = true;

            const apiKey = '';
            const prompt = `浣犳槸涓€涓嚭棰樹笓瀹躲€傝鏍规嵁浠ヤ笅鐭ヨ瘑鐐逛笂涓嬫枃锛岀敓鎴?閬撳崟閫夐銆?            鐭ヨ瘑鐐癸細${conceptTitle}
            鑳屾櫙璧勬枡锛?{contextText}

            try {
                const response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',

                renderQuiz(quiz);

                btnEl.disabled = false;

        }

        function renderQuiz(quiz) {
            const containerEl = document.getElementById('quiz-container');
            const btnEl = document.getElementById('ai-gen-btn');
            const submitBtn = document.getElementById('submitBtn');
            
            containerEl.innerHTML = `<div style="font-size: 13px; color: var(--accent); margin-bottom: 16px; font-weight: 600;">鉁?宸叉垚鍔熺敓鎴?AI 閽堝鎬ц缁冿細</div>`;
            
            userAnswers = {};

            currentQuizData = quiz;

            Object.keys(quiz).forEach(id => {

                const card = document.createElement('div');

            submitBtn.disabled = false;
            submitBtn.innerText = '鎻愪氦骞舵煡鐪?AI 瑙ｆ瀽';
        }

        // 5. DeepSeek AI 鍔╂暀閫昏緫
        async function askAI() {

            try {
