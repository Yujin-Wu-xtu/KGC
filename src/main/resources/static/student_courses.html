<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知微智学 - 我的课程</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-w: 260px;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar styles */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .logo-area {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid var(--border);
        }

        .logo-area h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(to right, #2563eb, #8b5cf6);
            -webkit-background-clip: text;
            color: transparent;
            margin: 0;
        }

        .nav-menu { padding: 24px 16px; flex: 1; }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 8px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-item:hover { background-color: #f8fafc; color: var(--primary); }
        .nav-item.active { background-color: #eff6ff; color: var(--primary); }
        .nav-icon { margin-right: 12px; font-size: 18px; }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header {
            height: 70px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .page-title { font-size: 18px; font-weight: 600; margin: 0; }

        .container {
            padding: 32px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        /* Course Grid */
        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
        }

        .course-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .course-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border-color: #cbd5e1;
        }

        .course-cover { height: 160px; position: relative; }
        .cover-1 { background: url('数据结构封面.jpeg') center/cover no-repeat; background-color: #3b82f6;}
        .cover-2 { background: url('计算机组成原理(1).jpg') center/cover no-repeat; background-color: #10b981;}
        .cover-3 { background: url('线性代数.jpg') center/cover no-repeat; background-color: #f59e0b;}
        .cover-new { 
            background: linear-gradient(135deg, #1e293b, #334155); 
            display: flex; align-items: center; justify-content: center; 
            font-size: 40px; color: rgba(255,255,255,0.2);
        }

        .course-tag {
            position: absolute; top: 12px; right: 12px;
            background: rgba(255,255,255,0.25); backdrop-filter: blur(8px);
            color: white; padding: 4px 10px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
        }
        .course-tag.new-tag { background: var(--success); }

        .course-body { padding: 24px; flex: 1; display: flex; flex-direction: column; }
        .course-title { margin: 0 0 10px 0; font-size: 20px; font-weight: 700; color: var(--text-dark); }
        .course-desc { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin: 0 0 20px 0; flex: 1; }

        .course-progress {
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 6px;
            background: #f1f5f9;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-inner {
            height: 100%;
            background: var(--primary);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .progress-text {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .course-actions { display: flex; gap: 12px; }
        .btn-action {
            flex: 1; text-align: center; padding: 10px 0; border-radius: 8px;
            text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #f8fafc; color: var(--text-dark); border: 1px solid var(--border); }
        .btn-secondary:hover { background: #f1f5f9; }

    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-area">
            <h1>知微智学 · 学生版</h1>
        </div>
        <nav class="nav-menu">
            <a href="learning.html" class="nav-item">
                <span class="nav-icon">🏠</span> 学习主页
            </a>
            <a href="student_courses.html" class="nav-item active">
                <span class="nav-icon">📖</span> 我的课程
            </a>
            <a href="learning_for_kar_map.html" class="nav-item">
                <span class="nav-icon">🕸️</span> 知识图谱探索
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">📝</span> 测评练习
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">⚙️</span> 个人设置
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <h2 class="page-title">我的在修课程</h2>
            <div style="display: flex; align-items: center; gap: 16px;">
                <div style="font-size: 14px; color: var(--text-muted);">张同学 (20240001)</div>
                <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600;">张</div>
            </div>
        </header>

        <div class="container">
            <div class="course-grid" id="courseGrid">
                <!-- 动态加载课程 -->
            </div>
        </div>
    </main>

    <script>
        const COURSE_API = '/api/v1/courses/published';

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(COURSE_API);
                if (!response.ok) throw new Error('课程列表加载失败');
                const backendCourses = await response.json();
                
                const coursesToRender = backendCourses.map(tc => {
                    return {
                        id: tc.id,
                        title: tc.name,
                        tag: '专业课程',
                        desc: tc.description || '暂无简介',
                        progress: 0, // Mock progress for now
                        status: '可学习',
                        coverClass: 'cover-new',
                        isNew: false
                    };
                });
                renderCourses(coursesToRender);
            } catch (error) {
                console.warn('[KGC] course API unavailable.', error);
                document.getElementById('courseGrid').innerHTML = '<p>无法加载课程，请联系管理员。</p>';
            }
        });

        function renderCourses(courses) {
            const grid = document.getElementById('courseGrid');
            grid.innerHTML = '';
            
            courses.forEach(course => {
                let coverContent = `<span class="course-tag">${course.tag}</span>`;
                let titleContent = course.title;

                const cardHTML = `
                    <div class="course-card">
                        <div class="course-cover ${course.coverClass}">
                            ${coverContent}
                        </div>
                        <div class="course-body">
                            <h3 class="course-title">${titleContent}</h3>
                            <p class="course-desc">${course.desc}</p>
                            <div class="course-progress">
                                <div class="progress-bar"><div class="progress-inner" style="width: ${course.progress}%;"></div></div>
                                <div class="progress-text"><span>学习进度 ${course.progress}%</span> <span>${course.status}</span></div>
                            </div>
                            <div class="course-actions">
                                <a href="student_graph.html?courseId=${course.id}" class="btn-action btn-primary">进入图谱学习</a>
                                <a href="#" class="btn-action btn-secondary">课件资源</a>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }
    </script>
</body>
</html>
