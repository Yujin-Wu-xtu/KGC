<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知微智学 - 学生设置</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-w: 260px;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-dark); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: var(--sidebar-w); background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .logo-area { height: 70px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid var(--border); }
        .logo-area h1 { font-size: 20px; font-weight: 700; background: linear-gradient(to right, #2563eb, #8b5cf6); -webkit-background-clip: text; color: transparent; margin: 0; }
        .nav-menu { padding: 24px 16px; flex: 1; }
        .nav-item { display: flex; align-items: center; padding: 12px 16px; color: var(--text-muted); text-decoration: none; border-radius: 8px; margin-bottom: 8px; font-weight: 500; }
        .nav-item:hover { background: #f8fafc; color: var(--primary); }
        .nav-item.active { background: #eff6ff; color: var(--primary); font-weight: 600; }
        .nav-icon { margin-right: 12px; font-size: 18px; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .header { height: 70px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 10; }
        .container { padding: 32px; max-width: 800px; margin: 0 auto; width: 100%; box-sizing: border-box; }

        .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 32px; margin-bottom: 24px; }
        .panel h3 { font-size: 16px; margin: 0 0 24px 0; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
        .sub-label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
        .form-control { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn-save { background: var(--primary); color: white; padding: 10px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-save:hover { background: var(--primary-hover); }
        .msg { font-size: 13px; margin-top: 8px; }
        .msg-ok { color: #10b981; }
        .msg-err { color: #ef4444; }

        .profile-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .profile-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-area"><h1>知微智学 · 学生版</h1></div>
        <nav class="nav-menu">
            <a href="learning.html" class="nav-item"><span class="nav-icon">🏠</span>学习主页</a>
            <a href="student_courses.html" class="nav-item"><span class="nav-icon">📖</span>我的课程</a>
            <a href="student_graph.html" class="nav-item"><span class="nav-icon">🗺️</span>知识图谱探索</a>
            <a href="student_settings.html" class="nav-item active"><span class="nav-icon">⚙️</span>个人设置</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <h2 style="font-size: 18px; font-weight: 600; margin: 0; padding-left: 32px;">个人设置</h2>
            <div style="padding-right: 32px; display: flex; align-items: center; gap: 10px; cursor: pointer;" onclick="window.location.href='login.html'">
                <span style="font-size: 14px; font-weight: 500;">退出登录</span>
            </div>
        </header>

        <div class="container">
            <div class="panel">
                <h3>🔗 绑定教师</h3>
                <div class="form-group">
                    <label>输入教师用户名</label>
                    <span class="sub-label">绑定后，你的课程列表将仅显示该教师发布的课程。留空并保存可取消绑定。</span>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="teacherUsernameInput" class="form-control" placeholder="例如：teacher_wang" style="flex: 1;">
                        <button class="btn-save" style="white-space: nowrap;" onclick="bindTeacher()">保存绑定</button>
                    </div>
                </div>
                <div id="teacherBindMsg" class="msg"></div>
            </div>

            <div class="panel">
                <h3>📋 当前状态</h3>
                <p style="font-size: 13px; color: var(--text-muted);">
                    当前绑定的教师：<strong id="currentTeacherDisplay">未绑定</strong>
                </p>
                <p style="font-size: 13px; color: var(--text-muted);">
                    未绑定教师时，你将看到所有已发布的课程；绑定后仅显示该教师的课程。
                </p>
            </div>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('kgc_token') || sessionStorage.getItem('kgc_token');

        function showBindMsg(text, isError) {
            const el = document.getElementById('teacherBindMsg');
            el.textContent = text;
            el.className = 'msg ' + (isError ? 'msg-err' : 'msg-ok');
        }

        async function bindTeacher() {
            const input = document.getElementById('teacherUsernameInput');
            const teacherUsername = input.value.trim();

            if (!token) { showBindMsg('请先登录。', true); return; }

            try {
                const res = await fetch('/api/v1/auth/me/teacher', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ teacherUsername: teacherUsername || '' })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || '操作失败');

                if (teacherUsername) {
                    showBindMsg('已绑定教师：' + data.teacherUsername, false);
                    document.getElementById('currentTeacherDisplay').textContent = data.teacherUsername;
                } else {
                    showBindMsg('已取消教师绑定。', false);
                    document.getElementById('currentTeacherDisplay').textContent = '未绑定';
                }
            } catch (e) {
                showBindMsg(e.message, true);
            }
        }

        // 页面加载时从后端获取真实绑定状态
        (async function() {
            if (!token) return;
            try {
                const res = await fetch('/api/v1/auth/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) return;
                const profile = await res.json();
                if (profile.teacherUsername) {
                    document.getElementById('currentTeacherDisplay').textContent = profile.teacherUsername;
                    document.getElementById('teacherUsernameInput').value = profile.teacherUsername;
                    showBindMsg('当前绑定教师：' + profile.teacherUsername, false);
                } else {
                    document.getElementById('currentTeacherDisplay').textContent = '未绑定';
                    document.getElementById('teacherUsernameInput').placeholder = '输入教师用户名后点击保存';
                }
            } catch (e) { /* 网络不可用时保持默认显示 */ }
        })();
    </script>
</body>
</html>
