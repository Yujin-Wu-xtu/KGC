spring.application.name=KGC
spring.config.import=optional:file:./application-local.properties
# --- MySQL 数据库连接配置 ---

# 数据库的 JDBC URL
# 我们连接到本地的 3306 端口上的 kgc_db 数据库 (您刚创建的)
# useSSL=false 禁用SSL，开发时常用
# serverTimezone=UTC 设置时区为UTC
spring.datasource.url=${KGC_DB_URL:jdbc:mysql://127.0.0.1:3306/kgc_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}

# 您的 MySQL 用户名 (root 是默认的)
spring.datasource.username=${KGC_DB_USERNAME:root}

# ！！！关键！！！
# ！！！把 "你的数据库密码" 替换成您刚才安装 MySQL 时设置的那个 root 密码！！！
spring.datasource.password=${KGC_DB_PASSWORD:}

# 数据库驱动程序 (Spring Boot 3.x 会自动推断，但写上更清晰)
spring.datasource.password=${KGC_DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# --- JPA (Hibernate) 配置 ---

# 关键！这是“魔法”所在
# "update" 的意思是:
# Spring Boot 启动时，会比较您的 @Entity 类 (如 User.java) 和数据库 (kgc_db)
# 如果表 (users) 不存在，它会【自动创建】这张表。
# 如果类里多了个字段，它会【自动添加】这一列。
spring.jpa.hibernate.ddl-auto=update

# 让 Hibernate 在控制台打印它执行的 SQL 语句，方便我们调试
spring.jpa.show-sql=true

# 格式化打印的 SQL 语句
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8081
# --- 文件存储配置 ---
file.upload-dir=F:/kgc_uploads/

# --- 文件上传大小限制 ---
# 默认只有 1MB，上传大 PDF 会返回 413 错误
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# --- JWT (JSON Web Token) 配置 ---
# 1. Token 的 "签名密钥"
# 必须是一个非常强、非常长、非常随机的字符串 (Base64 编码)
# 你可以用在线工具生成一个 "HMAC-SHA-512" (HS512) 密钥，并确保它是 Base64 格式
# 【【【 这是一个示例密钥，你未来应该替换为你自己的！！！】】】
jwt.secret-key=${JWT_SECRET_KEY:ZGV2LW9ubHkta2djLWp3dC1zZWNyZXQtcmVwbGFjZS1pbi1zZXJ2ZXItZW52aXJvbm1lbnQtd2l0aC1hLXN0cm9uZy1zZWNyZXQta2V5}

# 2. Token 的 "有效时间" (毫秒)
# 86400000 毫秒 = 1000 * 60 * 60 * 24 = 24 小时
jwt.expiration-ms=86400000

# --- Neo4j 数据库连接配置 ---
spring.neo4j.uri=${NEO4J_URI:neo4j+s://ff544762.databases.neo4j.io}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:}

# --- DeepSeek API Configuration ---
# 请在此处填入您的 DeepSeek API Key
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.model=${DEEPSEEK_MODEL:deepseek-v4-pro}

# --- Verification Code Configuration ---
verification-code.ttl-seconds=${VERIFICATION_CODE_TTL_SECONDS:300}
verification-code.cooldown-seconds=${VERIFICATION_CODE_COOLDOWN_SECONDS:60}
verification-code.daily-limit=${VERIFICATION_CODE_DAILY_LIMIT:10}
verification-code.email.from=${KGC_MAIL_FROM:}
verification-code.sms.enabled=${TENCENT_SMS_ENABLED:false}
verification-code.sms.secret-id=${TENCENTCLOUD_SECRET_ID:}
verification-code.sms.secret-key=${TENCENTCLOUD_SECRET_KEY:}
verification-code.sms.region=${TENCENT_SMS_REGION:ap-guangzhou}
verification-code.sms.sdk-app-id=${TENCENT_SMS_SDK_APP_ID:}
verification-code.sms.sign-name=${TENCENT_SMS_SIGN_NAME:}
verification-code.sms.template-id=${TENCENT_SMS_TEMPLATE_ID:}

spring.mail.host=${KGC_MAIL_HOST:}
spring.mail.port=${KGC_MAIL_PORT:587}
spring.mail.username=${KGC_MAIL_USERNAME:}
spring.mail.password=${KGC_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${KGC_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${KGC_MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${KGC_MAIL_SMTP_SSL:false}
